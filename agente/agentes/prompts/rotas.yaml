# Orientação específica de cada intenção. Entra na variável {orientacao} da tarefa
# (tarefas.yaml) e, portanto, é lida pelo modelo: faz parte do prompt.
# Qual agente atende cada intenção está em agente/regras/roteador.py (ROTAS).
#
# {detalhe} é trocado pelo dado que o roteador extraiu da mensagem (hoje, só o nome
# de um padrão desconhecido); sem dado, fica "nenhum nome citado".

conceito:
  orientacao: >
    Explique o conceito em camadas: analogia, definição, participantes, consequências.
    Se falar de quando usar ou evitar, use só os itens da base.

selecao:
  orientacao: >
    Responda direto, sem reexplicar o conceito nem listar os participantes. Descreva uma
    situação em que o Observer é a melhor escolha e uma em que deve ser evitado, explicando o
    porquê de cada uma com os critérios da base.

fechamento:
  orientacao: >
    Apresente o checklist da base: os mesmos 7 itens, na mesma ordem, cada um em uma frase.
    Não acrescente itens nem repita os já ditos.

exemplo:
  orientacao: >
    Mostre um exemplo em Java e indique o papel de cada classe (Subject, Observer,
    ConcreteSubject, ConcreteObserver). Use domínio diferente do que já apareceu no histórico.
    Explique só o exemplo correto: não acrescente seção de uso incorreto nem regras que não
    estejam na base.

uso_incorreto:
  orientacao: >
    Mostre um dos erros listados na base. Prefira o exemplo de código da base (desanexar
    durante a notificação): adapte nomes e domínio, mas mantenha a estrutura do erro e da
    correção. Mostre só o trecho errado e o corrigido, no máximo 25 linhas, e explique por que
    o erro acontece. Não afirme causas de erro que não estejam na base.

confusao:
  orientacao: >
    Explique com qual padrão o Observer é mais confundido, a diferença principal, por que a
    confusão acontece e um critério prático para distinguir. Termine com uma pergunta de verificação.

exercicio:
  orientacao: Proponha um exercício curto (cenário + 1 ou 2 perguntas). Não dê a resposta.

resposta_exercicio:
  orientacao: >
    O estudante está respondendo ao exercício proposto no histórico. Avalie: o que está certo,
    o que está errado e por quê, dê uma pista e peça nova tentativa ou proponha o próximo passo.

solucao_pronta:
  orientacao: >
    O estudante pediu a solução pronta. NÃO escreva implementação: nenhuma classe com métodos
    implementados e nenhum método main. Responda só com: (1) uma frase gentil explicando que
    escrever o código é o que fixa o aprendizado; (2) uma lista numerada de 4 a 5 passos, cada um
    com uma pergunta que o estudante deve responder (quem é o Subject, quem são os observadores,
    push ou pull, em que momento o Subject deve notificar, como desanexar); (3) uma pergunta convidando-o a mostrar a
    primeira tentativa. Se quiser, mostre só a assinatura da interface Observer, sem corpo.

inventado:
  orientacao: >
    pedido para inventar um padrão ou sobre um padrão que não está no catálogo GoF
    (nome citado pelo estudante, {detalhe})
